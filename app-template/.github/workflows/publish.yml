name: Publish to portal

# Builds the app and force-pushes the bundle + manifest.json to the
# `portal-dist` branch, which is where the portal loads it from.
# This repo stays private; nothing is published to GitHub Pages.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portal-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci || npm install
      - run: npm run build

      - name: Write manifest.json
        run: |
          node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync("portal.json", "utf8"));
            m.entry = "app.js";
            m.styles = fs.existsSync("dist/app.css") ? "app.css" : null;
            m.version = process.env.GITHUB_SHA.slice(0, 7);
            m.built_at = new Date().toISOString();
            fs.writeFileSync("dist/manifest.json", JSON.stringify(m, null, 2));
          '
          ls -la dist

      - name: Push to portal-dist
        working-directory: dist
        run: |
          git init -q -b portal-dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish ${GITHUB_SHA::7}"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" portal-dist
